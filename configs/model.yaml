# model.yaml
# Configuration for model architecture: encoder, mapper, and vocoder.

encoder:
  content_model: airesearch/wav2vec2-large-xlsr-53-th
  freeze: true

mapper:
  architecture: bilstm
  input_dim: 1024
  lstm_hidden_size: 512
  lstm_num_layers: 2
  dropout: 0.1
  projection_hidden_dim: 256
  mel_dim: 80

vocoder:
  type: hifigan
  checkpoint: vendor/hifi-gan/checkpoints/UNIVERSAL_V1
  sample_rate: 22050
